{% extends "base.html" %}

{% block title %}Login — Дедушка Вобжак{% endblock %}

{% block navbar %}{% endblock %}

{% block extra_head %}
<style>
    .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .login-box {
        background: var(--bg2);
        border: 1px solid var(--border);
        padding: 32px 36px;
        width: 340px;
    }
    .login-box h1 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 24px;
        text-align: center;
    }
    .login-box input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 13px;
        outline: none;
        margin-bottom: 16px;
    }
    .login-box input[type="password"]:focus {
        border-color: var(--accent);
    }
    .login-box button {
        width: 100%;
        padding: 10px;
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: background .15s, color .15s;
    }
    .login-box button:hover {
        background: var(--accent);
        color: var(--bg);
    }
    .error-msg {
        color: var(--danger);
        font-size: 11px;
        text-align: center;
        margin-bottom: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        <h1>Дедушка Вобжак</h1>
        {% if error %}
        <div class="error-msg">ACCESS DENIED</div>
        {% endif %}
        <form method="post" action="/login">
            <input type="password" name="password" placeholder="password" autofocus autocomplete="current-password">
            <button type="submit">AUTHENTICATE</button>
        </form>
    </div>
</div>
{% endblock %}

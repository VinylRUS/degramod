<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Дедушка Вобжак{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0d0d0d;
            --bg2:       #141414;
            --bg3:       #1a1a1a;
            --border:    #2a2a2a;
            --text:      #c8c8c8;
            --text-dim:  #666;
            --accent:    #00cc66;
            --danger:    #cc3333;
            --warn:      #cc9933;
            --info:      #3399cc;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .navbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 44px;
            gap: 24px;
        }
        .navbar .brand {
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .navbar a {
            color: var(--text-dim);
            font-size: 12px;
            transition: color .15s;
        }
        .navbar a:hover { color: var(--text); text-decoration: none; }
        .navbar .spacer { flex: 1; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        tr:hover td { background: var(--bg3); }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid;
        }
        .badge-mute   { color: var(--warn);  border-color: var(--warn);  background: rgba(204,153,51,.1); }
        .badge-warn   { color: var(--info);  border-color: var(--info);  background: rgba(51,153,204,.1); }
        .badge-ban    { color: var(--danger); border-color: var(--danger); background: rgba(204,51,51,.1); }
        .badge-unmute { color: var(--accent); border-color: var(--accent); background: rgba(0,204,102,.1); }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 14px 16px;
        }
        .stat-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            margin-top: 4px;
        }

        .filter-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        .filter-tabs a {
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .filter-tabs a:hover { color: var(--text); text-decoration: none; }
        .filter-tabs a.active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .dim  { color: var(--text-dim); }

        /* ── Search bar ──────────────────────────────────────────── */
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 8px;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-results {
            position: absolute;
            background: var(--bg2);
            border: 1px solid var(--border);
            max-height: 320px;
            overflow-y: auto;
            z-index: 100;
            width: 400px;
        }
        .search-results a {
            display: block;
            padding: 8px 12px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }
        .search-results a:hover {
            background: var(--bg3);
            text-decoration: none;
            color: var(--accent);
        }

        /* ── Pagination ─────────────────────────────────────────── */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 20px;
            padding-bottom: 24px;
        }
        .pagination a, .pagination span {
            padding: 6px 12px;
            font-size: 11px;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .pagination a:hover { color: var(--text); text-decoration: none; border-color: var(--text-dim); }
        .pagination .current {
            color: var(--accent);
            border-color: var(--accent);
        }
        .pagination .disabled {
            opacity: .3;
            pointer-events: none;
        }

        /* ── Two-column layout for stats sections ──────────────── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 700px) {
            .two-col { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <span class="brand">ДЕДУШКА ВОБЖАК</span>
        <a href="/dashboard">DASHBOARD</a>
        <span class="spacer"></span>
        <a href="/logout">LOGOUT</a>
    </nav>
    {% endblock %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>

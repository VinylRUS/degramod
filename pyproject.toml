# Единственный источник правды по зависимостям. Точные версии всего дерева,
# включая транзитивные, зафиксированы в uv.lock по хешам — `uv sync --frozen`
# в Dockerfile ставит ровно их. requirements.txt удалён: два файла с
# зависимостями приходилось синхронизировать вручную, и они разъезжались
# (pyproject требовал Python >=3.11, Dockerfile собирал 3.14).

[project]
name = "ded-vobzhak"
version = "4.9.0"  # держать в синхроне с APP_VERSION в web_app.py
description = "Telegram-бот модерации чатов «Дед Вобжак» + FastAPI веб-панель"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "VinylRUS" },
]
dependencies = [
    "aiogram==3.30.0",
    "aiosqlite==0.20.0",
    "sqlalchemy[asyncio]==2.0.36",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.18",
    "aiohttp==3.13.3",
    # Конвертация WebP-стикеров → PNG для inline-блоков в Rich Messages (v4.8.3).
    "Pillow>=10.0.0",
    # Конвертация анимированных TGS-стикеров → PNG (v4.8.3).
    # Если не установится на платформе — fallback на отдельный send_sticker.
    "rlottie-python>=1.0.0",
    # Шифрование GitHub PAT в БД: Fernet, AES-128-CBC + HMAC-SHA256 (v4.8.5).
    # Используется в db._encrypt_pat / _decrypt_pat.
    "cryptography>=42.0.0",
    # v4.8.9: миграции БД. На проде выключены через DB_USE_LEGACY_MIGRATIONS=1,
    # но db.run_migrations_async() импортирует alembic — без пакета старт упадёт,
    # если флаг когда-нибудь снимут.
    "alembic>=1.13",
]

[tool.uv]
# Приложение, а не библиотека: модули лежат в корне (bot.py, db.py, ...),
# устанавливать проект в venv не нужно — только его зависимости.
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "freezegun>=1.5.5",
]

# ── ruff конфигурация ───────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py314"
# Исключаем генерируемые и внешние файлы.
extend-exclude = [
    "data/",
    ".venv/",
    "__pycache__/",
    "migrations/versions/",  # v4.8.9: autogenerate-файлы Alembic, не редактируются вручную
    # Легаси-сюита, залитая в main 16.08.2026 (была scripts/, стала tests/).
    # Под ruff даёт ~580 замечаний: несортированные импорты, импорты не в
    # начале файла (они там намеренно — после настройки env), неиспользуемые
    # импорты. Приводить её к линту стоит вместе с разбором known_failing.txt,
    # а не механически. Свой код в tools/ и tests/conftest.py линтуется.
    "tests/test_*.py",
    "tools/legacy/",
]

[tool.ruff.lint]
# E/W (pycodestyle), F (pyflakes), I (isort), B (bugbear), ASYNC (flake8-async),
# RUF (ruff-специфичные). ASYNC ловит блокирующие вызовы в async-функциях —
# для проекта, где веб-панель и бот делят один event loop, это ключевое правило.
select = ["E", "W", "F", "I", "B", "ASYNC", "RUF"]
ignore = [
    # E501: line too long — line-length=120, но иногда длинные URL/строки оправданы.
    "E501",
    # B008: function call in default argument — FastAPI Depends() так работает.
    "B008",
    # E712: comparison to True/False — SQLAlchemy фильтры требуют == True/False.
    "E712",
    # E711: comparison to None — SQLAlchemy .is_(None) предпочтим, но == None встречается.
    "E711",
    # RUF001-003 ругаются на кириллицу, похожую на латиницу. В русскоязычной
    # кодовой базе это 1296 срабатываний подряд и ноль полезного сигнала.
    "RUF001",
    "RUF002",
    "RUF003",
    # ASYNC240 требует trio.Path/anyio.path вместо os.path в async-функциях.
    # Правило заточено под trio/anyio, у нас голый asyncio. Речь про os.path.exists
    # и Path.exists — это stat() на локальном диске, микросекунды. Держать 8
    # исключений ради этого не стоит. ASYNC230 (реальный blocking open) оставлен.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# В db.py много SQLAlchemy моделей с длинными строками.
# B904 — pre-existing: raise без `from err` в _get_pat_encryption_key.
"db.py" = ["E501", "B904"]
# В bot_handlers.py 8369 строк — игнорируем complexity warnings.
# B904 — pre-existing raise без `from err` в _parse_duration.
# E402 — `import re as _san_re` локально в середине модуля (намеренно).
# B007 — `month_key` не используется в for-loop (намеренно, итерируем по dict).
# B023 — closure over loop variable в tg_safe_call(lambda: ...) — ложное срабатывание
#         (lambda вызывается синхронно внутри tg_safe_call, не отложенно).
# RUF059 — неиспользуемая распакованная переменная `settings` (строка 8205).
"bot_handlers.py" = [
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "B904", "E402",
    "B007", "B023", "RUF059",
]
# В web_app.py 4846 строк — аналогично.
# E402 — `from db import (...)` стоит после `_req_logger = logging.getLogger(...)`.
# Это намеренно: logger инициализируется до импорта db, чтобы в случае ошибки
# импорта db логгер уже был готов.
# B904 — pre-existing raise без `from err` в _parse_int_field.
# ASYNC230 — blocking open() в async-роутах (строки 738, 3333). Это долг из
# той же серии, что чинил v4.8.7 (sqlite/VACUUM/copy2 вынесены в to_thread),
# но open() тогда пропустили. Снимается в Task 6 плана стабилизации.
# RUF023/RUF059 — несортированный __slots__ и неиспользуемая распакованная
# переменная. Косметика, правится при следующей правке этих участков.
"web_app.py" = [
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "E402", "B904",
    "ASYNC230", "RUF023", "RUF059",
]
# E402 — late import в конце модуля (строка 1143). Остаток от снятого в v4.8.9
# хака sys.modules.setdefault("bot", ...) — импорт переехал, но вниз файла.
# RUF034 — бессмысленный if-else в строке 109.
"bot.py" = ["E402", "RUF034"]
# RUF019 — лишняя проверка ключа перед обращением к словарю (строка 131).
"github_client.py" = ["RUF019"]
# RUF022 — несортированный __all__.
"web/deps.py" = ["RUF022"]
# RUF059 — неиспользуемая распакованная переменная `deleted_chat_admins`
# (тело перенесено дословно из web_app.py, где это же было в общем
# RUF059-игноре модуля; Task 4, v4.9.0).
"web/admin_cleanup.py" = ["RUF059"]
# ASYNC230 — blocking open("/proc/self/status") в _bot_info. Долг из той же
# серии, что чинил v4.8.7; переехал сюда вместе с хелпером в v4.9.0.
# Снимается в Task 6 плана стабилизации.
"web/admin_settings.py" = ["ASYNC230"]

# ── pytest конфигурация ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Фильтры warnings — заглушаем шум от SQLAlchemy/aiohttp.
filterwarnings = [
    "ignore::DeprecationWarning:aiogram.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
]

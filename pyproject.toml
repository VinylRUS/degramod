# v4.8.9: pyproject.toml для локальной разработки.
#
# НЕ используется для деплоя — деплой идёт через requirements.txt + Dockerfile
# (см. 06_DO_NOT_TOUCH.md §16: requirements.txt = primary source of truth).
#
# Этот файл нужен для:
#   - IDE (PyCharm/VSCode): корректный Python version, deps autocomplete.
#   - `uv sync` / `uv pip install -e .` локально — если разработчик хочет
#     поставить пакет в editable-режиме.
#   - ruff/pytest конфигурации (через [tool.ruff] / [tool.pytest]).
#
# Если поменяли зависимости — ОБЯЗАТЕЛЬНО обновите requirements.txt тоже.
# Эти два файла должны быть синхронизированы вручную.

[project]
name = "ded-vobzhak"
version = "4.8.9"
description = "Telegram-бот модерации чатов «Дед Вобжак» + FastAPI веб-панель"
requires-python = ">=3.11"  # v4.8.9: Dockerfile bumped to 3.14; локально можно 3.11+
authors = [
    { name = "VinylRUS" },
]
dependencies = [
    "aiogram==3.30.0",
    "aiosqlite==0.20.0",
    "sqlalchemy[asyncio]==2.0.36",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.18",
    "aiohttp==3.13.3",
    "Pillow>=10.0.0",
    "rlottie-python>=1.0.0",
    "cryptography>=42.0.0",
    "alembic>=1.13",  # v4.8.9: миграции БД
]

[project.optional-dependencies]
# Dev-зависимости — не входят в production-образ.
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "alembic>=1.13",
]

[tool.uv]
# uv будет ставить dev-dependencies при `uv sync --extra dev`.
# Lock-файл (uv.lock) НЕ используется — requirements.txt = primary.
dev-dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "alembic>=1.13",
]

# ── ruff конфигурация ───────────────────────────────────────────────────────
# v4.8.9: добавлено для CI (см. .github/workflows/ci.yml).
# ruff = линтер + форматтер. Запускается через `ruff check .` и `ruff format .`.

[tool.ruff]
line-length = 120
target-version = "py314"  # v4.8.9: bumped together с Dockerfile
# Исключаем генерируемые и внешние файлы.
extend-exclude = [
    "data/",
    "scripts/",
    "uploads/",
    ".venv/",
    "__pycache__/",
    "migrations/versions/",  # v4.8.9: autogenerate-файлы Alembic, не редактируются вручную
]

[tool.ruff.lint]
# Правила: E/W (pycodestyle), F (pyflakes), I (isort), B (bugbear).
select = ["E", "W", "F", "I", "B"]
ignore = [
    # E501: line too long — line-length=120, но иногда длинные URL/строки оправданы.
    "E501",
    # B008: function call in default argument — FastAPI Depends() так работает.
    "B008",
    # E712: comparison to True/False — SQLAlchemy фильтры требуют == True/False.
    "E712",
    # E711: comparison to None — SQLAlchemy .is_(None) предпочтим, но == None встречается.
    "E711",
]

[tool.ruff.lint.per-file-ignores]
# В db.py много SQLAlchemy моделей с длинными строками.
# B904 — pre-existing: raise без `from err` в _get_pat_encryption_key.
"db.py" = ["E501", "B904"]
# В bot_handlers.py 8728 строк — игнорируем complexity warnings.
# B904 — pre-existing raise без `from err` в _parse_duration.
# E402 — `import re as _san_re` локально в середине модуля (намеренно).
# B007 — `month_key` не используется в for-loop (намеренно, итерируем по dict).
# B023 — closure over loop variable в tg_safe_call(lambda: ...) — ложное срабатывание
#         (lambda вызывается синхронно внутри tg_safe_call, не отложенно).
"bot_handlers.py" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "B904", "E402", "B007", "B023"]
# В web_app.py 4900 строк — аналогично.
# E402 — `from db import (...)` стоит после `_req_logger = logging.getLogger(...)`
# (строка 62-64). Это намеренно: logger инициализируется до импорта db, чтобы
# в случае ошибки импорта db логгер уже был готов.
# B904 — pre-existing raise без `from err` в _parse_int_field.
"web_app.py" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "E402", "B904"]
# v4.8.9: bot.py — E402 (module level import not at top) ложится на
# sys.modules.setdefault("bot", ...) хак в строке 52. Этот хак будет удалён
# в этапе D1 v4.8.9 (см. 03_TASK_v4.8.9.md §3). После удаления — E402 уйдёт.
"bot.py" = ["E402"]

# ── pytest конфигурация ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Тесты лежат в /home/z/my-project/scripts/, но запускаются с cwd=v488_work
# (чтобы import db/web_app находились). pytest находит test_*.py автоматически.
testpaths = ["scripts"]
python_files = ["test_*.py"]
python_functions = ["test_*", "t*"]
# Фильтры warnings — заглушаем шум от SQLAlchemy/aiohttp.
filterwarnings = [
    "ignore::DeprecationWarning:aiogram.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
]
